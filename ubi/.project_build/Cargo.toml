[package]
name = "ubi"
version = "0.1.0"
edition = "2024"

[build]
rustflags = ["-L", "libs"]

[dependencies]
lazy_static = "*"
may = { version = "*", default-features = false }
may_minihttp = { git = "https://github.com/fuji-184/may_minihttp.git", default-features = false }
may_postgres = { git = "https://github.com/Xudong-Huang/may_postgres.git", default-features = false }
serde = { version = "*", features=["derive"] }
serde_json = "*"
include_dir = "*"
num_cpus = "*"
rust-embed = { version = "8.5.0", features = ["include-exclude"] }
postgres-types = "0.2.9"
compact_str = { version = "*" }
regex = "*"
utoipa = { git = "https://github.com/fuji-184/utoipa.git", package = "utoipa" }
utoipa-swagger-ui = { git = "https://github.com/fuji-184/utoipa.git", package = "utoipa-swagger-ui" }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
codegen-units = 1
panic = 'abort'
lto = "thin"
debug = false
incremental = false
overflow-checks = false

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"
incremental = false
codegen-units = 512
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"

[features]
ws = []
postgres = []