name: Auto Tag and Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create new tag (auto-versioning)
        id: tagger
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: "v"
          default_bump: patch

      - name: Build binary
        run: cargo build --release

      - name: Rename binary
        run: |
          mkdir -p dist
          cp target/release/ubi dist/ubi_x86_64_linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tagger.outputs.new_tag }}
          name: Release ${{ steps.tagger.outputs.new_tag }}
          files: dist/ubi_x86_64_linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone Ubi_Doc repo
        run: |
          git clone https://x-access-token:${{ secrets.DOC_REPO_PAT }}@github.com/fuji-184/Ubi_Doc.git

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Track binary with Git LFS
        run: |
          cd Ubi_Doc
          git lfs track "static/ubi_x86_64_linux"
          git add .gitattributes
          git commit -m "Track large binary with Git LFS" || echo "LFS tracking already set"
          git push origin master


      - name: Copy binary to Ubi_Doc/static
        run: |
          mkdir -p Ubi_Doc/static
          cp dist/ubi_x86_64_linux Ubi_Doc/static/

      - name: Commit and push to Ubi_Doc
        run: |
          cd Ubi_Doc
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/ubi_x86_64_linux
          git commit -m "Update binary to ${{ steps.tagger.outputs.new_tag }}" || echo "No changes to commit"
          git push origin master
