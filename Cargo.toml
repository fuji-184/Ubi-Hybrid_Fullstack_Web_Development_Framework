[package]
name = "ubi"
version = "0.1.0"
edition = "2021"

[dependencies]
lazy_static = "*"
clap = "*"
regex = "1"
include_dir = "*"
uuid = { version = "*", features = ["v4"] }
serde_json = "*"
walkdir = "*"
postgres-types = "0.2.9"
rust-embed = "8.6.0"
may_postgres = { git = "https://github.com/Xudong-Huang/may_postgres.git", default-features = false }
serde = { version = "*", features = ["derive"] }
notify = "8.0.0"

# compact_str = { version = "*", features = ["serde", "smallvec"] }

